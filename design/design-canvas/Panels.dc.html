<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MRH1 — Body panels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA3AE;text-decoration:none}a:hover{color:#EDEFF2}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; box-sizing: border-box; background: #0E1116; color: #EDEFF2; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 56px 16px 40px 16px">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #9AA3AE; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">Live · updated 07:42</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Body panels</h1>
    </div>
    <span style="font-size: 13px; color: #3DDC97; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #3DDC97"></span>14 of 16 in range</span>
  </div>

  <div style="display: flex; gap: 8px; overflow: hidden">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </div>

  <sc-for list="{{panels}}" as="p" hint-placeholder-count="4">
    <div style="background: #171B22; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="{{p.dotStyle}}"></span>
          <span style="font-size: 17px; font-weight: 800">{{p.name}}</span>
        </div>
        <span style="{{p.statusStyle}}">{{p.status}}</span>
      </div>
      <sc-for list="{{p.rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid #222832">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
            <span style="font-size: 13px; color: #C9CED6">{{r.name}}</span>
            <div style="display: flex; align-items: baseline; gap: 6px">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">{{r.value}}</span>
              <span style="font-size: 11px; color: #9AA3AE">{{r.unit}}</span>
              <span style="{{r.flagStyle}}">{{r.flag}}</span>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 12px; align-items: center">
            <div style="position: relative; height: 10px">
              <div style="position: absolute; left: 0; right: 0; top: 3px; height: 4px; border-radius: 2px; background: #222832"></div>
              <div style="{{r.bandStyle}}"></div>
              <div style="{{r.markStyle}}"></div>
            </div>
            <svg width="64" height="18" viewBox="0 0 64 18" aria-hidden="true"><polyline fill="none" stroke="{{r.color}}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" points="{{r.spark}}"></polyline></svg>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <p style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 1.5; color: #9AA3AE">Dashed zone = your normal range (last 30 days). Line on the right = last 7 days. Tap any row for its meaning. Sample values.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'All' }; }
  renderVals() {
    const C = { N: '#3DDC97', H: '#FFB454', L: '#7DBBFF' };
    const BG = { N: '#24302B', H: '#2A2418', L: '#1E2A3A' };
    const row = (name, value, unit, flag, band, mark, spark) => ({
      name: name, value: value, unit: unit, flag: flag, color: C[flag],
      flagStyle: 'font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: ' + BG[flag] + '; color: ' + C[flag],
      bandStyle: 'position: absolute; top: 0; height: 10px; box-sizing: border-box; border: 1.5px dashed #3E5A4C; border-radius: 5px; background: rgba(61,220,151,0.10); left: ' + band[0] + '%; width: ' + (band[1] - band[0]) + '%',
      markStyle: 'position: absolute; top: -2px; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; box-sizing: border-box; border: 3px solid #0E1116; background: ' + C[flag] + '; left: ' + mark + '%',
      spark: spark.map((v, i) => (i * 10.5 + 1) + ',' + (16 - v * 14)).join(' ')
    });
    const panel = (name, tint, rows) => {
      const out = rows.filter((r) => r.flag !== 'N').length;
      return {
        name: name, rows: rows,
        dotStyle: 'width: 10px; height: 10px; border-radius: 5px; background: ' + tint,
        status: out === 0 ? 'All in range' : out + ' to watch',
        statusStyle: 'font-size: 12px; font-weight: 700; color: ' + (out === 0 ? C.N : C.H)
      };
    };
    const all = [
      panel('Heart', '#FF6B7A', [
        row('Resting heart rate', '72', 'bpm', 'N', [30, 60], 48, [0.5, 0.6, 0.4, 0.5, 0.55, 0.6, 0.55]),
        row('HRV (overnight)', '46', 'ms', 'N', [35, 70], 50, [0.4, 0.5, 0.3, 0.6, 0.55, 0.5, 0.6]),
        row('Heart rate in sleep', '66', 'bpm', 'N', [30, 65], 52, [0.5, 0.45, 0.5, 0.4, 0.5, 0.55, 0.45]),
        row('Heart rate recovery', '−28', 'bpm/1 min', 'N', [40, 80], 58, [0.4, 0.5, 0.45, 0.6, 0.5, 0.55, 0.6])
      ]),
      panel('Breathing', '#4DD0E1', [
        row('Breathing rate (sleep)', '14.6', '/min', 'N', [35, 65], 46, [0.5, 0.5, 0.55, 0.5, 0.45, 0.5, 0.5]),
        row('Blood oxygen (SpO2)', '96', '%', 'N', [50, 100], 62, [0.6, 0.65, 0.6, 0.7, 0.65, 0.6, 0.65])
      ]),
      panel('Sleep', '#A78BFA', [
        row('Total sleep', '9 h 35', '', 'H', [35, 65], 82, [0.3, 0.5, 0.2, 0.55, 0.45, 0.4, 0.9]),
        row('Deep sleep', '59', 'min', 'N', [30, 65], 40, [0.4, 0.5, 0.45, 0.35, 0.5, 0.4, 0.45]),
        row('REM sleep', '2 h 05', '', 'N', [35, 70], 60, [0.5, 0.4, 0.5, 0.55, 0.45, 0.5, 0.6]),
        row('Time to fall asleep', '32', 'min', 'H', [10, 40], 66, [0.3, 0.4, 0.35, 0.5, 0.45, 0.55, 0.65]),
        row('Awake / restless', '29', 'min', 'N', [20, 60], 44, [0.5, 0.45, 0.4, 0.5, 0.55, 0.45, 0.4])
      ]),
      panel('Temperature', '#FFB454', [
        row('Skin temp vs baseline', '+0.2', '°C', 'N', [35, 65], 54, [0.5, 0.45, 0.5, 0.55, 0.5, 0.45, 0.55])
      ]),
      panel('Activity & load', '#4DA3FF', [
        row('Steps (7-day avg)', '8 401', '/day', 'N', [40, 75], 58, [0.3, 0.4, 0.35, 0.5, 0.45, 0.9, 0.2]),
        row('Active zone minutes', '109', 'min/day', 'N', [30, 70], 62, [0.2, 0.25, 0.2, 0.9, 0.3, 0.6, 0.1]),
        row('Cardio load (week)', '111', '/760', 'L', [40, 80], 18, [0.2, 0.3, 0.25, 0.3, 0.2, 0.15, 0.1]),
        row('Energy burned', '3 741', 'kcal/day', 'N', [35, 70], 52, [0.5, 0.55, 0.5, 0.45, 0.5, 0.55, 0.5])
      ])
    ];
    const tabs = ['All', 'Heart', 'Breathing', 'Sleep', 'Activity'];
    const chips = tabs.map((t) => ({
      label: t,
      pick: () => this.setState({ tab: t }),
      style: 'flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 0; cursor: pointer; font-size: 13px; font-weight: 700; ' +
        (this.state.tab === t ? 'background: #EDEFF2; color: #0E1116' : 'background: #171B22; color: #C9CED6')
    }));
    const panels = this.state.tab === 'All' ? all : all.filter((p) => p.name.indexOf(this.state.tab) === 0);
    return { chips: chips, panels: panels };
  }
}
</script>
</body>
</html>
