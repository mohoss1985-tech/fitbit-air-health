<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRH1 demo</title>
<meta name="description" content="Interactive replica of the MRH1 iPhone app, running on synthetic sample data in your browser.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEBE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<script>
  // Theme before first paint: ?theme=dark|light, else system appearance.
  (function () {
    var q = new URLSearchParams(location.search).get('theme');
    var dark = q ? q === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
/* ------------------------------------------------------------------ tokens (DESIGN_SPEC §2) */
:root {
  --paper:#EDEBE7; --card:#FAF9F7; --ink:#151413; --graphite:#6B665F; --graphite2:#A8A39C; --hair:#DFDBD5; --track:#E9E6E1;
  --ember:#F0582A; --emberInk:#B83F17; --peach:#F3A79E; --iris:#8B88F0;
  --good:#2F9D68; --goodBg:#DDF0E4; --goodText:#1F6E47;
  --limit:#E6B820; --limitBg:#FBF0C8; --limitText:#7A5D05;
  --danger:#D23A3A; --dangerBg:#F8DCD8; --dangerText:#A92C2C;
  --stageDeep:#4B4880; --stageCore:#C9B8A6; --stageREM:#8B88F0; --stageAwake:#E48888;
  --frost:rgba(250,249,247,.62); --scrim:rgba(21,20,19,.28); --page:#E4E1DC;
  --font-ui: Geist, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", Geist, -apple-system, system-ui, sans-serif;
  --font-mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.23,1,.32,1); --ease-morph: cubic-bezier(.77,0,.175,1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper:#151413; --card:#1F1D1B; --ink:#F2EFEA; --graphite:#B4AEA7; --graphite2:#8A847D; --hair:#2E2B28; --track:#2A2724;
  --goodBg:#1F2E25; --goodText:#8FD4AE; --limitBg:#332C14; --limitText:#F0D67A; --dangerBg:#3A1F1C; --dangerText:#F0A3A3;
  --stageCore:#8E8173; --frost:rgba(31,29,27,.62); --scrim:rgba(0,0,0,.5); --page:#0E0D0C;
  color-scheme: dark;
}

/* ------------------------------------------------------------------ page + phone frame */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 400 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px 32px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.pagebar { width: 100%; max-width: 390px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--graphite); }
.pagebar a { color: var(--ink); font-weight: 500; text-decoration: none; }
.pagebar a:hover { text-decoration: underline; }
.hint { max-width: 390px; margin: 0; text-align: center; font-size: 12px; color: var(--graphite); }
.phone { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: var(--paper);
  box-shadow: 0 0 0 1px rgba(21,20,19,.08), 0 2px 4px rgba(21,20,19,.04), 0 24px 64px rgba(21,20,19,.14); isolation: isolate; }
@media (max-width: 500px) {
  body { padding: 0; gap: 0; }
  .pagebar, .hint { display: none; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
}
body.shot { padding: 0; background: var(--paper); }
body.shot .pagebar, body.shot .hint { display: none; }
body.shot .phone { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }

/* ------------------------------------------------------------------ type (9 roles) */
.display { font: 600 56px/1 var(--font-num); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.title { font: 600 28px/34px var(--font-ui); letter-spacing: -.02em; margin: 0; }
.metric { font: 600 34px/1 var(--font-num); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.headline { font: 600 17px/22px var(--font-ui); margin: 0; }
.body { font: 400 15px/21px var(--font-ui); margin: 0; }
.label { font: 500 13px/18px var(--font-ui); color: var(--graphite); margin: 0; }
.caption { font: 400 12px/16px var(--font-ui); color: var(--graphite); margin: 0; }
.micro { font: 500 11px/14px var(--font-ui); color: var(--graphite); }
.mono { font: 500 12px/16px var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.unit { font: 400 12px/1 var(--font-ui); color: var(--graphite); margin-left: 2px; letter-spacing: 0; }
.ink { color: var(--ink); }

/* ------------------------------------------------------------------ app chrome */
#app { position: absolute; inset: 0; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.screen { position: relative; min-height: 100%; padding: 0 20px 128px; }
.hdr { position: relative; padding-top: 54px; }
@media (max-width: 500px) { .hdr { padding-top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.orbs { position: absolute; left: -20px; right: -20px; top: 0; width: calc(100% + 40px); display: block; z-index: 0; pointer-events: none; }
.hdr > *:not(.orbs) { position: relative; z-index: 1; }
.topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; min-height: 44px; }
.topbar .mid { text-align: center; min-width: 0; }
.topbar .mid .headline { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--frost);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: inset 0 0 0 .5px var(--hair), 0 1px 2px rgba(21,20,19,.04), 0 8px 24px rgba(21,20,19,.06);
  transition: transform 160ms ease-out; }
.rbtn:active, .press:active { transform: scale(.97); }
.rbtn svg { width: 20px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px; font: 500 12px/1 var(--font-ui); white-space: nowrap; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip.good { background: var(--goodBg); color: var(--goodText); } .chip.good i { background: var(--good); }
.chip.limit { background: var(--limitBg); color: var(--limitText); } .chip.limit i { background: var(--limit); }
.chip.danger { background: var(--dangerBg); color: var(--dangerText); } .chip.danger i { background: var(--danger); }
.chip.plain { background: var(--frost); color: var(--ink); box-shadow: inset 0 0 0 .5px var(--hair); }
.chip.ns { background: var(--track); color: var(--graphite); } .chip.ns i { background: var(--graphite2); }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

.card { position: relative; z-index: 1; background: var(--card); border-radius: 28px; padding: 20px; margin-top: 12px; }
.card.tap { width: 100%; display: block; transition: transform 160ms ease-out; }
.card.tap:active { transform: scale(.985); }
.inner { background: var(--paper); border-radius: 16px; padding: 12px; }
.section { margin-top: 32px; }
.section > .label:first-child { margin: 0 0 0 4px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row.center { align-items: center; }
.stack > * + * { margin-top: 12px; }
.gap4 > * + * { margin-top: 4px; }
.gap8 > * + * { margin-top: 8px; }
.hairline { height: 1px; background: var(--hair); margin: 16px 0; transform: scaleY(.5); }
canvas.c { display: block; width: 100%; }
.foot { margin: 32px 4px 0; text-align: center; }
.foot p + p { margin-top: 4px; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 16px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wd .micro { color: var(--ink); opacity: .7; }
.wd .dc { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
.wd .dc svg { position: absolute; inset: 0; }
.wd .dc b { font: 600 12px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.wd.on .dc b { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.verdict { margin: 24px 4px 0; max-width: 20em; }
.verdict + .caption { margin: 8px 4px 0; color: var(--ink); opacity: .72; }

/* rings */
.rings { display: grid; grid-template-columns: 1.35fr 1fr 1fr; align-items: center; gap: 4px; }
.ring { position: relative; display: grid; place-items: center; margin: 0 auto; }
.ring svg { position: absolute; inset: 0; overflow: visible; }
.ring .rv { text-align: center; position: relative; }
.ring .rv b { display: block; }
.ringcell { display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 16px; padding: 4px 0; min-height: 44px; }
.tk { transition: stroke 1ms linear; }
.signals { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; }

/* tab bar */
.tabs { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 72px; border-radius: 36px; z-index: 5;
  display: grid; grid-template-columns: repeat(4, 1fr); background: var(--frost);
  -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  box-shadow: inset 0 0 0 .5px var(--hair), 0 1px 2px rgba(21,20,19,.04), 0 8px 24px rgba(21,20,19,.08); }
@media (max-width: 500px) { .tabs { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); } }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--graphite); font: 500 11px/1 var(--font-ui); }
.tab span.ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.tab svg { width: 20px; height: 20px; }
.tab.on { color: var(--ink); }
.tab.on span.ic { background: var(--ink); color: var(--paper); }

/* segmented black pill */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--track); border-radius: 999px; padding: 3px; margin-top: 16px; }
.seg button { height: 38px; border-radius: 999px; text-align: center; font: 500 13px/1 var(--font-ui); color: var(--graphite); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* metric rows */
.mrow { display: block; width: 100%; padding: 16px 0; }
.mrow + .mrow { border-top: .5px solid var(--hair); }
.mrow .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mrow .val { display: flex; align-items: baseline; justify-content: flex-end; white-space: nowrap; }
.mrow .val b { font: 600 22px/1 var(--font-num); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mrow .bot { display: grid; grid-template-columns: 1fr 72px; gap: 16px; align-items: center; margin-top: 12px; }
.ribbon { position: relative; height: 12px; }
.ribbon .tr { position: absolute; left: 0; right: 0; top: 4px; height: 4px; border-radius: 2px; background: var(--track); }
.ribbon .bd { position: absolute; top: 2px; height: 8px; border-radius: 4px; background: color-mix(in oklab, var(--ink) 12%, transparent); }
.ribbon .dt { position: absolute; top: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 2px var(--card); }
.spark { height: 28px; }
.strip { height: 34px; }
.strip.big { height: 44px; }

/* stage bar, heat */
.stagebar { display: flex; height: 16px; gap: 2px; border-radius: 8px; overflow: hidden; margin-top: 12px; }
.stagebar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.heat { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 22px); gap: 8px 6px; align-items: center; margin-top: 16px; }
.heat .hd { text-align: center; }
.heat i { width: 12px; height: 12px; border-radius: 50%; display: block; margin: 0 auto; }
.heat i.ns { background: none; box-shadow: inset 0 0 0 1px var(--graphite2); }
.heat .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }

/* panels strip, banner */
.panels { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 16px; }
.panels button { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-height: 44px; }
.panels .cap { width: 100%; height: 6px; border-radius: 999px; }
.banner { display: flex; gap: 12px; align-items: flex-start; }
.banner .bar { width: 4px; align-self: stretch; border-radius: 999px; background: var(--danger); flex: none; }

/* week cards */
.days { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-top: 16px; text-align: center; }
.days .d { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.days .d .num { font: 500 11px/1 var(--font-ui); color: var(--graphite); }
.days .d.on .micro { color: var(--ink); }

/* live */
.livehead { text-align: center; margin-top: 20px; }
.livehead .row { justify-content: center; align-items: baseline; gap: 4px; }
.livehead .unit { color: var(--ink); opacity: .72; }
.ticker { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink); }
.ticker i { width: 6px; height: 6px; border-radius: 50%; background: var(--ember); }
.chartwrap { position: relative; margin-top: 16px; }
.ripple { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 1.5px solid var(--ember); opacity: 0; pointer-events: none; }
.ripple.go { animation: ripple 1100ms var(--ease-out) forwards; }
@keyframes ripple { from { transform: scale(1); opacity: .35; } to { transform: scale(2.4); opacity: 0; } }
.mam { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 16px; }
.mam b { font: 600 20px/1 var(--font-num); font-variant-numeric: tabular-nums; display: block; margin-bottom: 4px; }
.arcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; text-align: center; }
.arcs .ring { margin-bottom: 8px; }

/* trends */
.tchart { height: 112px; margin-top: 16px; }
.tkey { display: flex; gap: 16px; margin-top: 8px; }
.tkey span { display: inline-flex; align-items: center; gap: 6px; }
.tkey i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.factor { display: grid; grid-template-columns: minmax(0,1fr) 120px 44px; gap: 12px; align-items: center; padding: 8px 0; }
.zbar { position: relative; height: 6px; border-radius: 999px; background: var(--track); }
.zbar span { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
.zbar::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink); }
.zbar.nz::after { display: none; }

/* sheets */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 10; animation: fade 200ms ease-out both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; z-index: 11; background: var(--paper); border-radius: 28px 28px 0 0;
  display: flex; flex-direction: column; animation: up 320ms var(--ease-out) both; box-shadow: 0 -8px 32px rgba(21,20,19,.12); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--graphite2); opacity: .6; margin: 8px auto 0; flex: none; }
.sheet .sh { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 8px 16px 0; gap: 8px; flex: none; }
.sheet .sh .mid { text-align: center; }
.sheet .sb { overflow-y: auto; padding: 4px 20px 40px; overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(100%); } } @keyframes fade { from { opacity: 0; } }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; width: 100%; }
.sw { width: 44px; height: 26px; border-radius: 999px; background: var(--track); position: relative; flex: none; transition: background 160ms ease-out; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(21,20,19,.2); transition: transform 160ms ease-out; }
[aria-checked="true"] .sw { background: var(--ink); }
[aria-checked="true"] .sw::after { transform: translateX(18px); }
.tag { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); font: 500 13px/1 var(--font-ui); box-shadow: inset 0 0 0 .5px var(--hair); }
.tag[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.flow { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 12px; }
.flow div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--card); border-radius: 16px; }
.guide dt { font: 600 15px/21px var(--font-ui); margin-top: 16px; display: flex; align-items: center; gap: 8px; }
.guide dd { margin: 4px 0 0; }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: fade 150ms ease-out both; }
  .ripple.go { animation: none; }
  .rbtn, .card.tap, .sw, .sw::after { transition: none; }
}
body.shot .sheet, body.shot .scrim { animation: none; }
</style>
</head>
<body>
  <div class="pagebar"><a href="../">MRH1 home</a><span>Sample data, not a real person</span></div>
  <div class="phone" id="phone"><div id="app"></div></div>
  <p class="hint">An interactive replica of the iPhone app. Tap the rings, rows and the menu. Every number is synthetic. Wellness estimates, not medical advice.</p>
  <script>if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');</script>
  <script src="data.js"></script>
  <script src="orbs.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
